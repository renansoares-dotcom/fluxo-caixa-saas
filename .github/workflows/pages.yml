name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Versiona os imports (js/css) com o commit: o navegador nunca usa um módulo antigo do cache após uma publicação
      - name: Versionar arquivos
        run: |
          V=${GITHUB_SHA::8}
          find js -name '*.js' -print0 | xargs -0 sed -i -E "s#((from|import)[[:space:]]*\(?[[:space:]]*['\"])(\.{1,2}/[^'\"]+\.js)(['\"])#\1\3?v=$V\4#g"
          sed -i -E "s#(js/app\.js|css/app\.css)\"#\1?v=$V\"#g" index.html
          grep -c "?v=$V" js/app.js index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
