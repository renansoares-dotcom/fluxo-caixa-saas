<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://ceyzvhcpgokysgmpdalt.supabase.co; connecq-src 'self' https://ceyzvhcpgokysgmpdalt.supabase.co wss://ceyzvhcpgokysgmpdalt.supabase.co; worker-src 'self' blob:; frame-src 'self' blob: https://ceyzvhcpgokysgmpdalt.supabase.co; objecq-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Atualização cadastral</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20261018a">
  <link rel="icon" type="image/svg+xml" href="assets/iplamm-icon.svg">
  <style>
    body{background:var(--bg)}
    .cq-wrap{max-width:1000px;margin:0 auto;padding:16px}
    .cq-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0 16px;border-bottom:1px solid var(--border);margin-bottom:16px}
    .cq-top img{height:40px}
    .cq-aviso{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px}
    .cq-ok{background:var(--pos-soft);color:var(--pos);border-radius:8px;padding:10px 12px;font-size:13px}
    .cq-wrap{max-width:860px}
    .cq-op{display:flex;flex-direction:column;gap:6px;margin:4px 0 8px}
    .cq-op label{display:flex;flex-direction:row;align-items:flex-start;gap:8px;font-weight:400;cursor:pointer}
    .cq-op input{width:auto;min-height:0;margin-top:3px}
    .cq-q{font-weight:600;margin-top:10px}
    .cq-dica{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
    .card h3{margin:0 0 8px}
  </style>
</head>
<body>
  <div class="cq-wrap">
    <div class="cq-top"><div style="display:flex;align-items:center;gap:12px"><img class="logo-light" src="assets/iplamm-logo.svg" alt=""><img class="logo-dark" src="assets/iplamm-logo-dark.svg" alt=""><div><b>Atualização cadastral — reforma tributária</b><div class="small muted" id="cq-emp"></div></div></div></div>
    <div id="cq-main"><div class="loading">Carregando…</div></div>
  </div>
  <div id="modal-root"></div><div id="toast-root"></div>
  <script type="module" src="js/cadastro-publico.js"></script>
</body>
