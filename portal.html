<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://ceyzvhcpgokysgmpdalt.supabase.co; connect-src 'self' https://ceyzvhcpgokysgmpdalt.supabase.co wss://ceyzvhcpgokysgmpdalt.supabase.co; worker-src 'self' blob:; frame-src 'self' blob: https://ceyzvhcpgokysgmpdalt.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Portal do Cliente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20261018a">
  <link rel="icon" type="image/svg+xml" href="assets/iplamm-icon.svg">
  <style>
    body{background:var(--bg)}
    .pt-wrap{max-width:1040px;margin:0 auto;padding:16px}
    .pt-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0 16px;border-bottom:1px solid var(--border);margin-bottom:16px}
    .pt-top img{height:40px}
    .pt-auth{max-width:420px;margin:40px auto}
    .pt-auth form{display:grid;gap:10px}
    .pt-aviso{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px}
    .pt-8d{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:8px}
    .pt-8d-p{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--border);border-radius:8px;padding:8px;opacity:.75}
    .pt-8d-p.ok{opacity:1;border-color:var(--pos)}
    .pt-8d-d{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--border)}
    .pt-8d-p.ok .pt-8d-d{background:var(--pos);color:#fff}
    .pt-n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--neg);color:#fff;font-size:11px;text-align:center;margin-left:4px}
    .pt-artes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    .pt-artes .pi-card .im{height:150px}.pt-artes .pi-card .im img{max-height:150px}.pt-artes .pi-card.pt-pend{border:2px solid var(--warn)}
    .pt-decida{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-left:4px solid var(--warn);margin-bottom:12px}
    .pt-botoes{display:flex;gap:8px;flex-wrap:wrap}.pt-ok{border-left:4px solid var(--pos);margin-bottom:12px}
    .pt-termo{border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45}
    .pt-wrap{max-width:1240px}
    @media (max-width:640px){ .pt-hide-sm{display:none} .pt-botoes .btn{flex:1} }
  </style>
</head>
<body>
  <div class="pt-wrap">
    <div class="pt-top"><div style="display:flex;align-items:center;gap:12px"><img class="logo-light" src="assets/iplamm-logo.svg" alt=""><img class="logo-dark" src="assets/iplamm-logo-dark.svg" alt=""><div><b>Portal do Cliente</b><div class="muted small" id="pt-quem"></div></div></div>
      <div id="pt-user" hidden style="display:flex;gap:8px;align-items:center"><select id="pt-cli"></select><button class="btn ghost small" id="pt-senha">Alterar senha</button><button class="btn ghost small" id="pt-sair">Sair</button></div></div>
    <div id="pt-main"><div class="loading">Carregando…</div></div>
  </div>
  <div id="modal-root"></div><div id="toast-root"></div>
  <script type="module" src="js/portal.js"></script>
</body>
</html>
