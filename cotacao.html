<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://ceyzvhcpgokysgmpdalt.supabase.co; connect-src 'self' https://ceyzvhcpgokysgmpdalt.supabase.co wss://ceyzvhcpgokysgmpdalt.supabase.co; worker-src 'self' blob:; frame-src 'self' blob: https://ceyzvhcpgokysgmpdalt.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Cotação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20261018a">
  <link rel="icon" type="image/svg+xml" href="assets/iplamm-icon.svg">
  <style>
    body{background:var(--bg)}
    .ct-wrap{max-width:1000px;margin:0 auto;padding:16px}
    .ct-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0 16px;border-bottom:1px solid var(--border);margin-bottom:16px}
    .ct-top img{height:40px}
    .ct-aviso{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px}
    .ct-ok{background:var(--pos-soft);color:var(--pos);border-radius:8px;padding:10px 12px;font-size:13px}
    .ct-preco{width:130px;text-align:right}
    @media (max-width:640px){ .ct-hide-sm{display:none} .ct-preco{width:100px} }
  </style>
</head>
<body>
  <div class="ct-wrap">
    <div class="ct-top"><div style="display:flex;align-items:center;gap:12px"><img class="logo-light" src="assets/iplamm-logo.svg" alt=""><img class="logo-dark" src="assets/iplamm-logo-dark.svg" alt=""><div><b>Pedido de cotação</b><div class="small muted" id="ct-emp"></div></div></div></div>
    <div id="ct-main"><div class="loading">Carregando…</div></div>
  </div>
  <div id="modal-root"></div><div id="toast-root"></div>
  <script type="module" src="js/cotacao.js"></script>
</body>
</html>
