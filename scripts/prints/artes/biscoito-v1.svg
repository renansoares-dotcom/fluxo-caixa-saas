<text x="24" y="92" font-size="15" font-family="Arial" font-weight="400" fill="#222">INGREDIENTES: farinha de trigo enriquecida com ferro e ácido fólico, açúcar,</text>
<text x="24" y="112" font-size="15" font-family="Arial" font-weight="400" fill="#222">gordura vegetal, açúcar invertido, amido, sal, fermentos químicos</text>
<text x="24" y="132" font-size="15" font-family="Arial" font-weight="400" fill="#222">(bicarbonato de sódio e de amônio), emulsificante lecitina de soja e aroma.</text>
<text x="24" y="152" font-size="15" font-family="Arial" font-weight="400" fill="#222">ALÉRGICOS: CONTÉM TRIGO E DERIVADOS DE SOJA. PODE CONTER LEITE.</text>
<text x="24" y="172" font-size="15" font-family="Arial" font-weight="400" fill="#222">CONTÉM GLÚTEN.</text>
