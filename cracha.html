<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://ceyzvhcpgokysgmpdalt.supabase.co; connect-src 'self' https://ceyzvhcpgokysgmpdalt.supabase.co wss://ceyzvhcpgokysgmpdalt.supabase.co; worker-src 'self' blob:; frame-src 'self' blob: https://ceyzvhcpgokysgmpdalt.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="robots" content="noindex">
  <title>Verificação de crachá</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" type="image/svg+xml" href="assets/iplamm-icon.svg">
  <style>
    body{background:var(--bg);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
    .vc{max-width:420px;width:100%;text-align:center}
    .vc .sit{font-size:26px;font-weight:700;margin:10px 0 4px}
    .vc .sit.ok{color:var(--pos)} .vc .sit.nao{color:var(--neg)}
    .vc .ic{width:64px;height:64px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:34px;color:#fff}
    .vc .ic.ok{background:var(--pos)} .vc .ic.nao{background:var(--neg)}
    .vc dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;text-align:left;margin:16px 0 0} .vc dt{color:var(--muted)} .vc dd{margin:0;font-weight:600}
  </style>
</head>
<body>
  <div class="card vc" id="vc"><div class="loading">Verificando…</div></div>
  <script type="module" src="js/cracha.js"></script>
</body>
</html>
